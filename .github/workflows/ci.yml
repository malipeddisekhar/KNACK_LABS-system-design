name: Production Readiness CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: Intentionally fail before Docker build to verify fail-fast gating
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  sequential-ci:
    name: Lint, test, build, and publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Clean dependency install
        run: npm ci

      - name: Lint and static checks
        run: npm run lint

      - name: Compile Nest application
        run: npm run build

      - name: Unit and contract tests
        run: node --experimental-vm-modules ./node_modules/jest/bin/jest.js src/teams/team-activity-feed.spec.ts src/teams/team-collaboration-contracts.spec.ts --runInBand

      - name: Check patch whitespace
        working-directory: .
        run: git diff --check

      - name: Optional fail-fast drill
        if: success() && inputs.simulate_failure
        run: |
          echo "Intentional failure requested; Docker build must be skipped."
          exit 1

      - name: Build SHA-tagged Docker image
        if: success()
        run: docker build -t "local/upsk-system-design-api:$GITHUB_SHA" .

      - name: Enforce image size limit
        if: success()
        run: |
          set -eu
          image="local/upsk-system-design-api:$GITHUB_SHA"
          size_bytes="$(docker image inspect "$image" --format '{{.Size}}')"
          max_bytes=$((512 * 1024 * 1024))
          if [ "$size_bytes" -gt "$max_bytes" ]; then
            echo "::error::Image size $size_bytes bytes exceeds $max_bytes-byte limit"
            exit 1
          fi
          size_mib=$((size_bytes / 1024 / 1024))
          echo "Image size $size_bytes bytes ($size_mib MiB) is within $max_bytes-byte limit"

      - name: Validate registry namespace
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          REGISTRY_NAMESPACE: ${{ vars.REGISTRY_NAMESPACE }}
        run: |
          if [ -z "$REGISTRY_NAMESPACE" ]; then
            echo "::error::Set the repository variable REGISTRY_NAMESPACE to the Docker Hub account or organization."
            exit 1
          fi

      - name: Login to Docker Hub
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Tag and push commit image
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          REGISTRY_NAMESPACE: ${{ vars.REGISTRY_NAMESPACE }}
        run: |
          set -eu
          image_tag="docker.io/$REGISTRY_NAMESPACE/upsk-system-design-api:$GITHUB_SHA"
          docker tag "local/upsk-system-design-api:$GITHUB_SHA" "$image_tag"
          docker push "$image_tag"
          echo "Published image tag: $image_tag"
